plugins { id 'com.android.application' }

// Runtime resource overlay on the framework ("android"). It adds a "No cutout"
// entry to Developer options > Simulate display with cutout; choosing it makes
// the system report no display cutout, so every app lays out full screen.
android {
    namespace 'com.android.internal.display.cutout.emulation.waterfall'
    compileSdk 36

    defaultConfig {
        applicationId 'com.android.internal.display.cutout.emulation.waterfall'
        minSdk 30
        targetSdk 36
        versionCode 1700
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile rootProject.file('keystore/release.jks')
            storePassword 'nocutout17'
            keyAlias 'nocutout'
            keyPassword 'nocutout17'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    lint { abortOnError false; checkReleaseBuilds false }
}
